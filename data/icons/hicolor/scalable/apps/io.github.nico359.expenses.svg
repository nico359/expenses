<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Clip banknotes at wallet level -->
    <clipPath id="walletClip">
      <rect x="0" y="0" width="128" height="55"/>
    </clipPath>
  </defs>
  
  <!-- Wallet body (smaller) -->
  <path d="M 28 55 L 28 105 Q 28 112 35 112 L 93 112 Q 100 112 100 105 L 100 65 Q 100 55 93 55 L 35 55 Q 28 55 28 65 Z" fill="#8B6F47" stroke="#5D4E37" stroke-width="1.5"/>
  
  <!-- Wallet highlight -->
  <path d="M 30 60 L 30 66 Q 30 68 33 68 L 97 68 Q 100 68 100 66 L 100 60 Q 100 58 97 58 L 33 58 Q 30 58 30 60 Z" fill="#A0845F" opacity="0.6"/>
  
  <!-- Dollar sign on wallet -->
  <g transform="translate(64, 82)">
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -5 -3 Q -5 -5 -2 -5 L 2 -5 Q 5 -5 5 -3 Q 5 -1 2 -1 L -2 -1" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -5 1 Q -5 3 -2 3 L 2 3 Q 5 3 5 5 Q 5 7 2 7 L -2 7" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Banknotes clipped at wallet level -->
  <g clip-path="url(#walletClip)">
    <!-- Third banknote (orange) - slightly more horizontal -->
    <g transform="translate(36, 55) rotate(64)">
      <rect x="0" y="-48" width="24" height="48" rx="2" fill="#FF9800" stroke="#E65100" stroke-width="1.5"/>
      <rect x="3" y="-43" width="18" height="33" fill="#FFB74D" opacity="0.7"/>
      <line x1="8" y1="-30" x2="16" y2="-30" stroke="#E65100" stroke-width="1"/>
      <line x1="8" y1="-20" x2="16" y2="-20" stroke="#E65100" stroke-width="1"/>
      <line x1="8" y1="-10" x2="16" y2="-10" stroke="#E65100" stroke-width="1"/>
    </g>
    
    <!-- Second banknote (blue) - slightly more horizontal -->
    <g transform="translate(36, 55) rotate(68)">
      <rect x="0" y="-45" width="24" height="45" rx="2" fill="#2196F3" stroke="#1565C0" stroke-width="1.5"/>
      <rect x="3" y="-40" width="18" height="30" fill="#64B5F6" opacity="0.7"/>
      <line x1="8" y1="-28" x2="16" y2="-28" stroke="#1565C0" stroke-width="1"/>
      <line x1="8" y1="-19" x2="16" y2="-19" stroke="#1565C0" stroke-width="1"/>
      <line x1="8" y1="-10" x2="16" y2="-10" stroke="#1565C0" stroke-width="1"/>
    </g>
    
    <!-- First banknote (green) - almost horizontal, front -->
    <g transform="translate(36, 55) rotate(72)">
      <rect x="0" y="-40" width="24" height="40" rx="2" fill="#4CAF50" stroke="#2E7D32" stroke-width="1.5"/>
      <rect x="3" y="-35" width="18" height="25" fill="#66BB6A" opacity="0.7"/>
      <line x1="8" y1="-25" x2="16" y2="-25" stroke="#2E7D32" stroke-width="1"/>
      <line x1="8" y1="-17" x2="16" y2="-17" stroke="#2E7D32" stroke-width="1"/>
      <line x1="8" y1="-9" x2="16" y2="-9" stroke="#2E7D32" stroke-width="1"/>
    </g>
  </g>
</svg>
