[package]
name = "expenses"
version = "1.3.1"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { version = "0.11", package = "gtk4", features = ["gnome_50"] }
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_9"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
